name: 'Mock Terraform Multi-Server Pipeline'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  terraform-plan:
    name: 'Mock Terraform Plan'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Terraform Init
        run: |
          echo "=========================================="
          echo "Ejecutando: terraform init"
          echo "=========================================="

      - name: Simulate Terraform Plan
        run: |
          echo "=========================================="
          echo "Ejecutando: terraform plan general"
          echo "Plan listo para evaluar destinos."
          echo "=========================================="

  apply-server-1:
    name: 'Apply to Server 1'
    needs: terraform-plan
    runs-on: self-hosted
    # Entorno protegido exclusivo para el Server 1
    environment: production-server-1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Terraform Apply Server 1
        run: |
          echo "=========================================="
          echo "¡Aprobado para Server 1!"
          echo "Ejecutando: terraform apply -auto-approve (Server 1)"
          echo "¡Infraestructura aplicada con éxito en Server 1!"
          echo "=========================================="

  apply-server-2:
    name: 'Apply to Server 2'
    needs: terraform-plan
    runs-on: self-hosted
    # Entorno protegido exclusivo para el Server 2
    environment: production-server-2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Terraform Apply Server 2
        run: |
          echo "=========================================="
          echo "¡Aprobado para Server 2!"
          echo "Ejecutando: terraform apply -auto-approve (Server 2)"
          echo "¡Infraestructura aplicada con éxito en Server 2!"
          echo "=========================================="
