name: 'Mock Terraform Pipeline'

on:
  workflow_dispatch:

  push:
    branches:
      - '**'

jobs:
  terraform-plan:
    name: 'Mock Terraform Plan'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Terraform Init
        run: |
          echo "=========================================="
          echo "Ejecutando: terraform init"
          echo "Inicializando los plugins y backend..."
          echo "=========================================="

      - name: Simulate Terraform Plan
        run: |
          echo "=========================================="
          echo "Ejecutando: terraform plan"
          echo "Plan: 2 a agregar, 0 a cambiar, 0 a destruir."
          echo "Cambios simulados detectados con éxito."
          echo "=========================================="

  terraform-apply:
    name: 'Mock Terraform Apply'
    needs: terraform-plan
    runs-on: self-hosted
    # Requiere aprobación manual mediante el entorno protegido en GitHub
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Terraform Init
        run: |
          echo "=========================================="
          echo "Ejecutando: terraform init (Apply phase)"
          echo "=========================================="

      - name: Simulate Terraform Apply
        run: |
          echo "=========================================="
          echo "Ejecutando: terraform apply -auto-approve"
          echo "Aplicando cambios simulados..."
          echo "¡Infraestructura aplicada con éxito!"
          echo "=========================================="
