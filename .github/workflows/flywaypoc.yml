name: Flyway

on:
  push:
    branches:
      - feature/actions
      - main

  # Allows manual execution with a specific choice
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to perform'
        required: true
        default: 'migrate'
        type: choice
        options:
          - migrate
          - undo

env:
  FLYWAY_VERSION: "12.6.2"
  FLYWAY_URL: "jdbc:postgresql://localhost:5432/demo"
  FLYWAY_USER: "demo"
  FLYWAY_PASSWORD: "demo" # Note: Use GitHub Secrets for production!
  FLYWAY_LOCATIONS: "filesystem:migrations"

jobs:
  info:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Download Flyway
        run: |
          wget -qO flyway.tar.gz https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${{ env.FLYWAY_VERSION }}/flyway-commandline-${{ env.FLYWAY_VERSION }}-linux-x64.tar.gz
          tar -xzf flyway.tar.gz

      - name: Flyway info
        run: |
          ./flyway-${{ env.FLYWAY_VERSION }}/flyway \
            -url="${{ env.FLYWAY_URL }}" \
            -user="${{ env.FLYWAY_USER }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -locations="${{ env.FLYWAY_LOCATIONS }}" \
            info

  migrate:
    runs-on: self-hosted
    needs: info
    environment: apply-changes
    steps:
      - uses: actions/checkout@v4

      - name: Download Flyway
        run: |
          wget -qO flyway.tar.gz https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${{ env.FLYWAY_VERSION }}/flyway-commandline-${{ env.FLYWAY_VERSION }}-linux-x64.tar.gz
          tar -xzf flyway.tar.gz

      - name: Run migrations
        run: |
          ./flyway-${{ env.FLYWAY_VERSION }}/flyway \
            -url="${{ env.FLYWAY_URL }}" \
            -user="${{ env.FLYWAY_USER }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -locations="${{ env.FLYWAY_LOCATIONS }}" \
            migrate

  undo:
    runs-on: self-hosted
    needs: info
    environment: rollback-changes
    steps:
      - uses: actions/checkout@v4

      - name: Download Flyway
        run: |
          wget -qO flyway.tar.gz https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${{ env.FLYWAY_VERSION }}/flyway-commandline-${{ env.FLYWAY_VERSION }}-linux-x64.tar.gz
          tar -xzf flyway.tar.gz

      - name: Undo migrations
        run: |
          ./flyway-${{ env.FLYWAY_VERSION }}/flyway \
            -url="${{ env.FLYWAY_URL }}" \
            -user="${{ env.FLYWAY_USER }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -locations="${{ env.FLYWAY_LOCATIONS }}" \
            undo
