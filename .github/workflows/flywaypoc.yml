name: Flyway

on:
  push:
    branches:
      - feature/actions
      - main

jobs:
  migrate:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Download Flyway
        run: |
          wget -qO flyway.tar.gz https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/12.6.2/flyway-commandline-12.6.2-linux-x64.tar.gz
          tar -xzf flyway.tar.gz

      - name: Run migrations
        run: |
          ./flyway-12.6.2/flyway \
            -url=jdbc:postgresql://localhost:5432/demo \
            -user=demo \
            -password=demo \
            -locations=filesystem:migrations \
            migrate
